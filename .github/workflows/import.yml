name: Import CloudOps MVP sources
on:
  push:
    paths:
      - '.bundle/part4.txt'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source files and remove temporary bundle
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, zlib
          from pathlib import Path
          root=Path('.').resolve()
          encoded=''.join((root/'.bundle'/f'part{i}.txt').read_text() for i in range(1,5))
          sources=json.loads(zlib.decompress(base64.b64decode(encoded)))
          for name,content in sources.items():
              p=(root/name).resolve()
              if not p.is_relative_to(root): raise ValueError('Unsafe path')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8')
          print('Restored',len(sources),'source files')
          PY
          git rm -rf .bundle .github/workflows/import.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish CloudOps AI Assistant source and tests"
          git push
